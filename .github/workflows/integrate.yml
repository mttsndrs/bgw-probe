name: Integrate Branches

on:
  push:
    branches:
      - uptime-fix
      - fiber-sensor-status
      - log-cleanup
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  merge-to-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the merged code back to GitHub
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git can calculate merges

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Integration Branch
        run: |
          # 1. Switch to integration branch (create it if missing)
          git checkout integration || git checkout -b integration
          
          # 2. Reset it completely to main to ensure a clean base
          git reset --hard origin/main
          
          # 3. Read the source branches from the push trigger configuration
          branches=$(awk '
            /^  push:/ { in_push=1; next }
            in_push && /^  [^ ]/ { in_push=0 }
            in_push && /^      - / { sub(/^      - /, ""); print }
          ' .github/workflows/integrate.yml)
          if [ -z "$branches" ]; then
            echo "No source branches found in on.push.branches" >&2
            exit 1
          fi

          # 4. Fetch and merge each configured source branch in order
          while IFS= read -r branch; do
            echo "Fetching and merging $branch..."
            git fetch origin "$branch"
            git merge "origin/$branch" -X theirs --no-edit
          done <<< "$branches"

          # 6. Force-push the newly combined integration branch to GitHub
          git push origin integration --force
